server:
  address: 0.0.0.0
  port: 8080

spring:
    config:
        import: optional:file:.env[.properties]
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
    
    mongodb:
        database: synapseai

    security:
        oauth2:
            client:
                registration:
                    google:
                        scope: profile, email

management:
    metrics:
        tags:
            application: synapse-ai  
    endpoint:
        health:
            show-details: always
    endpoints: 
        web:
            exposure:
                include: health, info, prometheus

